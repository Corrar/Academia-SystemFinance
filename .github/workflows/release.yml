# Publica a release no GitHub sempre que o arquivo VERSION muda na main.
# As notas vêm da seção da versão no CHANGELOG.md (o mesmo texto da página Novidades do sistema).
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Ler a versão
        id: versao
        run: |
          versao="$(python versao.py)"
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$versao" >/dev/null; then
            echo "existe=sim" >> "$GITHUB_OUTPUT"
            echo "A release v$versao já existe: nada a fazer."
          fi
      - name: Publicar a release
        if: steps.versao.outputs.existe != 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          python versao.py notas "$VERSAO" > notas.md
          gh release create "v$VERSAO" --target "$GITHUB_SHA" \
            --title "$(python versao.py titulo "$VERSAO")" --notes-file notas.md --latest
