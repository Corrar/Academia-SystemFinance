# Publica no GitHub a release de cada versão do CHANGELOG.md que ainda não tem uma.
# A versão atual (arquivo VERSION) aponta para o commit do push e vira a "Latest";
# as antigas usam o commit listado em .github/releases-anteriores.txt.
# As notas vêm da seção da versão no CHANGELOG.md (o mesmo texto da página Novidades do sistema).
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION, CHANGELOG.md, .github/releases-anteriores.txt, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Publicar as releases que faltam
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          atual="$(python versao.py)"
          for v in $(python versao.py lista); do
            if gh release view "v$v" >/dev/null 2>&1; then
              echo "v$v já publicada."
              continue
            fi
            if [ "$v" = "$atual" ]; then
              alvo="$GITHUB_SHA"; ultima=true
            else
              alvo="$(awk -v v="$v" '$1 == v {print $2}' .github/releases-anteriores.txt)"; ultima=false
            fi
            if [ -z "$alvo" ]; then
              echo "::warning::Sem commit para a v$v em .github/releases-anteriores.txt"
              continue
            fi
            python versao.py notas "$v" > notas.md
            gh release create "v$v" --target "$alvo" --title "$(python versao.py titulo "$v")" \
              --notes-file notas.md --latest=$ultima
          done
